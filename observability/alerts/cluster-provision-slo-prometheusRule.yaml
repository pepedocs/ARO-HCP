apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: cluster-provision-slo-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Provisioning SLO Alerts — Latency (Stuck Operations)
  # ========================================
  # Cluster create operations stuck in non-terminal phases are invisible to
  # the Errors SLI (which only counts terminal phases) and require investigation.
  #
  # Threshold: 30 minutes (1800s). Cluster provisioning typically takes ~13
  # minutes for HCP (P99 ~18 min). The 60-minute operation deadline
  # (defaultCreateOperationCompletionDeadlineDuration) marks operations as
  # failed, so the threshold must be well below 60 min to provide early detection.
  #
  # Stickiness (max_over_time ... [6h:5m]): while a resource stays wedged,
  # the raw condition can transiently clear — most commonly when the backend
  # retries the operation and resets backend_resource_operation_start_time_seconds,
  # briefly dropping (time() - start_time) below the 1800s threshold. Each clear
  # auto-resolves the IcM incident and the next re-fire opens a brand-new one.
  # Holding the condition firing over a 6h look-back collapses a
  # continuously-stuck resource into a single long-lived incident; genuinely
  # distinct stuck episodes more than 6h apart still get their own incident.
  - name: arohcp_cluster_provision_slo_latency_alerts
    labels:
      component: slo
    rules:
    - alert: userJourneyClusterProvisionStuckOperation
      expr: |
        max by (
          cluster,
          environment,
          region,
          subscription_id,
          resource_id,
          resource_type,
          operation_type,
          phase
        ) (
          max_over_time(
            (latency:backend_cluster_provision:inflight_duration_seconds > 1800)[6h:5m]
          )
        )
        and on (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase)
        latency:backend_cluster_provision:inflight_duration_seconds
      for: 15m
      labels:
        exclude_internal_subscriptions: "true"
        severity: "4"
      annotations:
        summary: "{{ $labels.cluster }}: Cluster create operation for {{ $labels.resource_id }} stuck in {{ $labels.phase }} for over 30 minutes"
        description: "Cluster create operation for {{ $labels.resource_id }} has been in {{ $labels.phase }} phase for over 30 minutes. Stuck operations are invisible to success/failure SLIs and require investigation."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-provision"
  # ========================================
  # Cluster Provisioning SLO Alerts: Windowed Errors (burn-rate)
  # ========================================
  # These read the counter-based windowed recording rules
  # (errors:backend_cluster_provision:{failed,total,error_rate}_{5m,30m,1h,6h,72h}),
  # which use rate() over backend_cluster_provision_completions_total to measure
  # true completion event rates over each window.
  #
  # Paired windows: each burn tier requires both long and short windows to
  # exceed the threshold, preventing stale long-window data from paging when
  # the short window has recovered.
  - name: arohcp_cluster_provision_slo_windowed_error_alerts
    labels:
      component: slo
    rules:
    # Fast Burn (IcM Sev 3, page). 14.4x burn: >72% failure rate over 1h AND 5m.
    - alert: userJourneyClusterProvisionErrors1h5m
      expr: |
        errors:backend_cluster_provision:error_rate_1h > 0.72
        and
        errors:backend_cluster_provision:error_rate_5m > 0.72
      for: 5m
      labels:
        severity: "3"
        slo: cluster-provision-errors
        long_window: 1h
        short_window: 5m
      annotations:
        summary: "Cluster create operations failing fast (>72% failure rate over 1h and 5m)"
        description: "More than 72% of completed cluster create operations failed over both the last hour and last 5 minutes, a 14.4x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-provision"
    # Medium Burn (IcM Sev 3, page). 6x burn: >30% failure rate over 6h AND 30m.
    - alert: userJourneyClusterProvisionErrors6h30m
      expr: |
        errors:backend_cluster_provision:error_rate_6h > 0.30
        and
        errors:backend_cluster_provision:error_rate_30m > 0.30
      for: 30m
      labels:
        severity: "3"
        slo: cluster-provision-errors
        long_window: 6h
        short_window: 30m
      annotations:
        summary: "Cluster create operation error rate elevated (>30% over 6h and 30m)"
        description: "More than 30% of completed cluster create operations failed over both the last 6 hours and last 30 minutes, a 6x burn of the 95% SLO budget."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-provision"
    # Slow Burn / Budget (IcM Sev 4, ticket). 1x burn: >5% failure rate over 72h AND 6h.
    - alert: userJourneyClusterProvisionErrors72h6h
      expr: |
        errors:backend_cluster_provision:error_rate_72h > 0.05
        and
        errors:backend_cluster_provision:error_rate_6h > 0.05
      for: 6h
      labels:
        severity: "4"
        slo: cluster-provision-errors
        long_window: 72h
        short_window: 6h
      annotations:
        summary: "Cluster create operation error budget burning (>5% over 72h and 6h)"
        description: "More than 5% of completed cluster create operations failed over both the last 72 hours and last 6 hours, a 1x burn that exhausts the 95% SLO error budget over the window."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-provision"
    # Early Warning / Degradation (IcM Sev 4, ticket). Single window: >15% failure rate over 30m.
    - alert: userJourneyClusterProvisionErrorsDegradation
      expr: |
        errors:backend_cluster_provision:error_rate_30m > 0.15
      for: 30m
      labels:
        severity: "4"
        slo: cluster-provision-errors
        long_window: 30m
      annotations:
        summary: "Cluster create operation failure rate exceeds 15% over 30m"
        description: "More than 15% of completed cluster create operations failed over the last 30 minutes, an early warning of degradation before the burn-rate alerts fire."
        runbook_url: "https://aka.ms/arohcp-runbook-cluster-provision"
