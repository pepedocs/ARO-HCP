apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: recording-rules
  name: cluster-provision-slo-recording-rules
  namespace: monitoring
spec:
  groups:
  # ========================================
  # Cluster Provisioning SLO Recording Rules: Windowed Errors (counter-based)
  # ========================================
  # These windowed records use rate() over the backend_cluster_provision_completions_total
  # counter, which increments on each cluster create terminal transition. rate()
  # correctly handles counter resets and measures true event rates over the window.
  #
  # Canceled operations are excluded from both numerator and denominator:
  # only phase="failed" and phase="succeeded" are counted.
  #
  # When both numerator and denominator are zero (no traffic), the division
  # yields NaN. NaN comparisons return false in PromQL, so alerts will not fire.
  - name: arohcp_cluster_provision_slo_windowed_recording_rules
    interval: 1m
    rules:
    # --- 5m window (fast burn short) ---
    - record: errors:backend_cluster_provision:failed_5m
      expr: |
        sum(rate(backend_cluster_provision_completions_total{phase="failed"}[5m]))
    - record: errors:backend_cluster_provision:total_5m
      expr: |
        sum(rate(backend_cluster_provision_completions_total{phase=~"succeeded|failed"}[5m]))
    - record: errors:backend_cluster_provision:error_rate_5m
      expr: |
        errors:backend_cluster_provision:failed_5m
        /
        errors:backend_cluster_provision:total_5m
    # --- 30m window (medium burn short / degradation) ---
    - record: errors:backend_cluster_provision:failed_30m
      expr: |
        sum(rate(backend_cluster_provision_completions_total{phase="failed"}[30m]))
    - record: errors:backend_cluster_provision:total_30m
      expr: |
        sum(rate(backend_cluster_provision_completions_total{phase=~"succeeded|failed"}[30m]))
    - record: errors:backend_cluster_provision:error_rate_30m
      expr: |
        errors:backend_cluster_provision:failed_30m
        /
        errors:backend_cluster_provision:total_30m
    # --- 1h window (fast burn long) ---
    - record: errors:backend_cluster_provision:failed_1h
      expr: |
        sum(rate(backend_cluster_provision_completions_total{phase="failed"}[1h]))
    - record: errors:backend_cluster_provision:total_1h
      expr: |
        sum(rate(backend_cluster_provision_completions_total{phase=~"succeeded|failed"}[1h]))
    - record: errors:backend_cluster_provision:error_rate_1h
      expr: |
        errors:backend_cluster_provision:failed_1h
        /
        errors:backend_cluster_provision:total_1h
    # --- 6h window (medium burn long / slow burn short) ---
    - record: errors:backend_cluster_provision:failed_6h
      expr: |
        sum(rate(backend_cluster_provision_completions_total{phase="failed"}[6h]))
    - record: errors:backend_cluster_provision:total_6h
      expr: |
        sum(rate(backend_cluster_provision_completions_total{phase=~"succeeded|failed"}[6h]))
    - record: errors:backend_cluster_provision:error_rate_6h
      expr: |
        errors:backend_cluster_provision:failed_6h
        /
        errors:backend_cluster_provision:total_6h
    # --- 72h window (slow burn long, 3d) ---
    - record: errors:backend_cluster_provision:failed_72h
      expr: |
        sum(rate(backend_cluster_provision_completions_total{phase="failed"}[72h]))
    - record: errors:backend_cluster_provision:total_72h
      expr: |
        sum(rate(backend_cluster_provision_completions_total{phase=~"succeeded|failed"}[72h]))
    - record: errors:backend_cluster_provision:error_rate_72h
      expr: |
        errors:backend_cluster_provision:failed_72h
        /
        errors:backend_cluster_provision:total_72h
  # ========================================
  # Cluster Provisioning SLO Recording Rules — Latency
  # ========================================
  # These rules track the Latency SLI for HCP cluster provisioning (install).
  # The SLI measures how long each cluster create operation has been in flight
  # (time since operation start, for operations still in non-terminal phase).
  #
  # Metrics are gauge-based: backend_resource_operation_start_time_seconds
  # (unix timestamp) joined with backend_resource_operation_phase_info to
  # filter to in-flight operations only.
  #
  # This is a per-resource metric (not fleet-aggregate) — each in-flight
  # operation produces its own duration series, enabling per-cluster stuck
  # operation detection and dashboard drill-down.
  - name: arohcp_cluster_provision_latency_recording_rules
    interval: 1m
    rules:
    # Current age (seconds) of each in-flight cluster create operation.
    # Only emits for operations in non-terminal phases (accepted, provisioning).
    # Terminal operations (succeeded, failed, canceled) are excluded — they
    # have already completed and their outcome is covered by the Errors SLI.
    - record: latency:backend_cluster_provision:inflight_duration_seconds
      expr: |
        max by (cluster, environment, region, subscription_id, resource_id, resource_type, operation_type, phase) (
          (
            time() - backend_resource_operation_start_time_seconds{
              resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
              operation_type="create"
            }
          )
          and
          backend_resource_operation_phase_info{
            resource_type="microsoft.redhatopenshift/hcpopenshiftclusters",
            operation_type="create",
            phase=~"accepted|provisioning"
          } == 1
        )
